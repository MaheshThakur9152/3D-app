<!DOCTYPE html>
<html lang="en">

<head>
	<title>Crystal Jewels Configurator</title>
	<meta name="description" content="Jewelry product visualization and configuration using WEBGi">
	<meta charset="UTF-8" />
	<link rel="apple-touch-icon" sizes="180x180" href="assets/favicons/apple-touch-icon.png">
	<link rel="icon" type="image/png" sizes="32x32" href="assets/favicons/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="assets/favicons/favicon-16x16.png">
	<link rel="manifest" href="assets/favicons/site.webmanifest">
	<meta name="msapplication-TileColor" content="#22052f">
	<meta name="theme-color" content="#22052f">

	<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@100;200;300;400;500;600;700;800;900&family=Playfair+Display+SC:wght@400;700;900&family=Qwitcher+Grypen:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
	<div class="loader">
		<svg width="48" height="48" fill="none" xmlns="http://www.w3.org/2000/svg"><mask id="a" style="mask-type:alpha" maskUnits="userSpaceOnUse" x="9" y="3" width="32" height="42"><path d="M25 44a15 15 0 1 0 0-30 15 15 0 0 0 0 30Z" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="m18 8 3-4h8l3 4-7 6-7-6Z" fill="#555" stroke="#fff" stroke-linecap="round" stroke-linejoin="round"/></mask><g mask="url(#a)"><path d="M0 0h48v48H0V0Z" fill="#ffffff"/></g></svg>
		<p>Loading... Please wait</p>
		<div class="progress"></div>
	</div>

	<div class="exit--container night--mode--filter">
		<h3 class="customize--title">Customize your ring</h3>
		<div class="header--controls">
			<svg class="music--control--2" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
				<path d="M11 5L6 9H2V15H6L11 19V5Z" stroke="#52322B" stroke-linecap="round" stroke-linejoin="round"/>
				<path d="M19.07 4.92999C20.9447 6.80527 21.9979 9.34835 21.9979 12C21.9979 14.6516 20.9447 17.1947 19.07 19.07M15.54 8.45999C16.4774 9.39763 17.004 10.6692 17.004 11.995C17.004 13.3208 16.4774 14.5924 15.54 15.53" stroke="#52322B" stroke-linecap="round" stroke-linejoin="round"/>
			</svg>
		</div>
	</div>

	<div class="footer--container">
		<div class="footer--menu night--mode--filter">
			<ul>
				<li><img class="config--gem" alt="Config gem" width="32" height="32" src="assets/images/diamond.svg"></li>
				<li><img class="config--material" alt="Config Material" width="32" height="32" src="assets/images/material.svg"></li>
				<li><img class="config--ring" alt="Config Material" width="32" height="32" src="assets/images/ring.svg"></li>
			</ul>
		</div>
		<div class="gem--menu">
			<ul class="colors--list">
				<li class="ruby active"><img alt="Fancy color" width="32" height="32" src="assets/images/ruby.svg"></li>
				<li class="faint"><img alt="Fancy color" width="32" height="32" src="assets/images/faint.svg"></li>
				<li class="fancy"><img alt="Fancy color" width="32" height="32" src="assets/images/fancy.svg"></li>
				<li class="aqua"><img alt="Fancy color" width="32" height="32" src="assets/images/aqua.svg"></li>
				<li class="swiss"><img alt="Fancy color" width="32" height="32" src="assets/images/swiss.svg"></li>
				<li class="yellow"><img alt="Fancy color" width="32" height="32" src="assets/images/yellow.svg"></li>
				<li class="orange"><img alt="Fancy color" width="32" height="32" src="assets/images/orange.svg"></li>
				<li class="green"><img alt="Fancy color" width="32" height="32" src="assets/images/green.svg"></li>
				<li class="emerald"><img alt="Fancy color" width="32" height="32" src="assets/images/emerald.svg"></li>
				<li class="rose"><img alt="Fancy color" width="32" height="32" src="assets/images/rose.svg"></li>
				<li class="violet"><img alt="Fancy color" width="32" height="32" src="assets/images/violet.svg"></li>
				<li class="close-gems"><svg width="24" height="24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20ZM15 9l-6 6M9 9l6 6" stroke="#52322B" stroke-linecap="round" stroke-linejoin="round"/></svg></li>
			</ul>
		</div>
		<div class="materials--menu">
			<ul class="materials--list">
				<li class="default active"><img alt="default color" width="60" src="assets/images/default.png"></li>
				<li class="silver-gold"><img alt="silver-gold" width="60" src="assets/images/silver_gold.png"></li>
				<li class="silver-silver"><img alt="Fancy color" width="60" src="assets/images/silver_silver.png"></li>
				<li class="gold-gold"><img alt="Fancy color" width="60" src="assets/images/gold_gold.png"></li>
				<li class="rose-silver"><img alt="Fancy color" width="60" src="assets/images/rose_silver.png"></li>
				<li class="gold-rose"><img alt="Fancy color" width="60" src="assets/images/gold_rose.png"></li>
				<li class="rose-rose"><img alt="Fancy color" width="60" src="assets/images/rose_rose.png"></li>
				<li class="close-materials"><svg width="24" height="24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20ZM15 9l-6 6M9 9l6 6" stroke="#52322B" stroke-linecap="round" stroke-linejoin="round"/></svg></li>
			</ul>
		</div>
	</div>

	<div id="webgi-canvas-container">
		<canvas id="webgi-canvas"></canvas>
	</div>

	<script type="module" src="/src/index.ts"></script>
</body>

</html>
